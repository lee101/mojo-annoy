[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-annoy"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"
bench-parallel = "python bench/parallel_sweep.py"
bench-project = "python bench/project_probe.py"
bench-rerank = "python bench/rerank_probe.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092605"
python = "3.13.*"
pytest = "*"
numpy = "*"
max-core = "==26.7.0.dev2026092605"

[pypi-dependencies]
annoy = "==1.17.3"
